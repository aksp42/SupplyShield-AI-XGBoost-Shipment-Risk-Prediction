
name: SupplyShield AI CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Git LFS Files
        run: |
          git lfs pull

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Verify Project Structure
        run: |
          test -f Akanksha_Singh_SupplyShieldAI.py
          test -f README.md
          test -f requirements.txt
          test -f assets/supplyshield_frozen.pkl
          test -f assets/processed_data.pkl

      - name: Python Syntax Check
        run: |
          python -m py_compile Akanksha_Singh_SupplyShieldAI.py

      - name: Lint with Flake8
        run: |
          flake8 Akanksha_Singh_SupplyShieldAI.py \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Validate Frozen Assets
        run: |
          python - << 'PY'
          from pathlib import Path
          assert Path("assets/supplyshield_frozen.pkl").exists()
          assert Path("assets/processed_data.pkl").exists()
          print("Production assets verified.")
          PY

      - name: CI Passed
        run: |
          echo "SupplyShield AI build validation completed successfully."
